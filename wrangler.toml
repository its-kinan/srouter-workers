# Switch — edge-native LLM router on Cloudflare Workers.
# Deploy with: python3 scripts/deploy.py (restores cron; never reapply the DO migration).

name = "switch"
main = "src/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

# nodejs_compat: vendored executors use node:buffer / node:crypto shims
# (Qoder AES-CBC/RSA, translator Buffer usage) via Workers' Node compat layer.

[vars]
ENVIRONMENT = "production"

# --- D1: accounts, keys, logs, settings, admin ---
[[d1_databases]]
binding = "DB"
database_name = "switch-db"
database_id = "0c496b54-cd98-4b6c-8f37-d7d1c27dc4f2"
migrations_dir = "src/db/migrations"

# --- R2: log archive / config snapshots (Phase 2+) ---
[[r2_buckets]]
binding = "R2"
bucket_name = "switch-data"

# --- Durable Object: router state (round-robin, circuit breaker, model cache) ---
[[durable_objects.bindings]]
name = "SWITCH_STATE"
class_name = "SwitchState"

[[durable_objects.bindings]]
name = "LOGIN_LIMIT"
class_name = "LoginRateLimit"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SwitchState"]

# v2 adds the LoginRateLimit DO (global login brute-force counters).
# Never re-send v1 (already applied); deploy.py sends v2 alone on request.
[[migrations]]
tag = "v2"
new_sqlite_classes = ["LoginRateLimit"]

# --- Cron: OAuth token sweeper (replaces SRouter's in-process setInterval) ---
[triggers]
crons = ["* * * * *"]

# Raise the CPU ceiling for the per-request routing work (cold-start decrypt
# of 342 accounts briefly needs headroom; warm requests are unaffected).
[limits]
cpu_ms = 5000

# --- Static assets: minimal Phase 1 dashboard shell in public/ ---
[assets]
directory = "./public"
not_found_handling = "single-page-application"

# --- Worker secrets (set via `wrangler secret put`, NEVER committed) ---
# MASTER_KEY                          32-byte base64 key for AES-GCM credential encryption
# ANTIGRAVITY_OAUTH_CLIENT_SECRET     Google OAuth client secret for Antigravity token refresh
# Bring-your-own OAuth client (optional; fixes redirect_uri_mismatch when the
# hardcoded SRouter OAuth clients don't have the Worker callback URL registered):
#   ANTIGRAVITY_OAUTH_CLIENT_ID / _REDIRECT_URI
#   CLAUDE_OAUTH_CLIENT_ID / _REDIRECT_URI
#   CODEX_OAUTH_CLIENT_ID / _REDIRECT_URI   (OpenAI/Codex login)
# Register your own OAuth app, add https://<worker>/v1/auth/<provider>/callback
# as an authorized redirect URI, then set the client ID (+ redirect URI if it
# differs from the default). Query params ?client_id= / ?redirect_uri= on the
# /v1/auth/<provider>/login endpoint take precedence over these.
